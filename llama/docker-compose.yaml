services:
  llama-server:
    profiles: [llama]
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: llama-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /opt/models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/ornith-9b-Q8_0.gguf
      --alias ornith-9b
      --n-gpu-layers 999
      --ctx-size 262144
      --ctx-checkpoints 40
      --parallel 1
      --no-cache-idle-slots
      --cache-ram 0
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --threads 8
      --flash-attn on
      --fit off
      --temp 0.6
      --top-p 0.95
      --top-k 20
      --min-p 0.0
      --jinja
      --reasoning on
      --no-ui
    restart: unless-stopped

  llama-swap:
    profiles: [llama]
    image: ghcr.io/mostlygeek/llama-swap:cuda13
    container_name: llama-swap
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - llama-server
    restart: unless-stopped

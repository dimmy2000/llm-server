services:
  llama-swap:
    profiles: [llama]
    image: ghcr.io/mostlygeek/llama-swap:cuda13
    container_name: llama-swap
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /opt/models:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    restart: unless-stopped
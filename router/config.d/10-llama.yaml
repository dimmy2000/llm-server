# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# backend-llama — llama.cpp b10438 как дочерний процесс llama-swap.
# Параметры ядра задаются здесь и только здесь; sampling-пресет — CLI-флаги
# (thinking-пресет, совпадающий с thinking-пресетом NInfer), поля запроса его
# перекрывают. См. router/config.yaml (пины, профили) и ADR-0006.

models:
  backend-llama:
    name: "llama.cpp"
    unlisted: true
    # /opt/ninfer/lib здесь не нужен; CUDA-библиотеки — из образа llama.cpp.
    env:
      - LD_LIBRARY_PATH=/app:/usr/local/cuda-13.3/lib64
    cmd: >
      /app/llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/Qwen3.8-27B-NVFP4-MTP-GGUF/Qwen3.8-27B-NVFP4-MTP-HIGH.gguf
      --mmproj /models/Qwen3.8-27B-NVFP4-MTP-GGUF/mmproj-BF16.gguf
      --mmproj-offload
      --n-gpu-layers 999
      --split-mode tensor
      --tensor-split 50,50
      --ctx-size 180224
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --cache-ram 40960
      --cache-idle-slots
      --batch-size 2048
      --ubatch-size 512
      --threads 8
      --flash-attn on
      --fit off
      --jinja
      --reasoning on
      --temp 1.0
      --top-p 0.95
      --top-k 20
      --min-p 0
      --presence-penalty 0
      --repeat-penalty 1.0
      --spec-type draft-mtp,ngram-mod
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      --spec-draft-n-max 4
      --spec-draft-p-min 0.75
      --spec-ngram-mod-n-match 20
      --spec-ngram-mod-n-min 4
      --spec-ngram-mod-n-max 48
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 180224
    filters:
      # Единственный параметр, который нельзя выразить переносимо: NInfer
      # отвечает 400 при значении != 1, llama.cpp такого имени не знает вовсе.
      # Клиент под llama.cpp всё ещё может прислать `repeat_penalty` (не
      # стрипается) — это llama.cpp-only knob, NInfer молча игнорирует.
      stripParams: "repetition_penalty"

# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Страта-контракт: два видимых публичных ID — strata-iq3 (IQ3_XXS @131072) и
# strata-iq2 (IQ2_XS @262144) — рядом с родительским qwen3.8-27b. Движок живёт
# НАТИВНО на хосте (`/opt/strata`, systemd-юнит, порт 8081; переключение
# ролей — `strata-use.sh`): llama-swap его не запускает и не останавливает.
#
# Механика shim-модели (feasibility selection-карты, тикет 02; ADR-0007):
# llama-swap умеет только дочерние процессы (`cmd` обязателен), поэтому
# процесс-носитель — «пустышка», а `proxy` ведёт на чужой уже работающий
# сервер. `checkEndpoint: /health` llama-swap поллит до 200; exit процесса
# во время поллинга → prematureExit, process_command.go:596.
#
# WATCHDOG-shim: у llama-swap v265 пер-модельный healthCheckTimeout не
# работает (load.go:136 перезаписывает его глобальным, у нас 600 c), поэтому
# fast-fail при остановленном юните даёт сам cmd: shim живёт, только пока
# нативный /health отвечает; refusal при старте → exit за ~2 c →
# prematureExit → ошибка запроса сразу, без 600 c ожидания. Если юнит умирает
# под живым shim — watcher выходит, и следующий запрос фейлится так же
# быстро.
#
# Порт 8081 свободен (как в selection-карте). Привязка
# нативного сервера — шлюз docker-bridge (172.17.0.1, docker0); контейнер
# достаёт его через host-gateway (`extra_hosts:` в router/docker-compose.yaml).
# Шлюзовое имя host.docker.internal при небэкап-привязке Strata уже допущено
# её DNS-rebinding защитой (serve/server.py: host_names_for добавляет
# host.docker.internal для не-loopback привязки). LAN-интерфейсы не
# публикуются — с других хостов сервер не виден.
#
# Ответы Strata не зависят от имени запроса: `useModelName` не нужен
# (OPENAI-путь: любой model отрабатывает, serve/server.py model_for), но
# поле `model` в ответе — канон native-ID `qwen3.8-flash-next-iq*_…`
# (llama-swap тело ответа не переписывает): имя запроса в ответ не
# возвращается.
#
# Честность «ID ↔ загруженный размер» llama-swap не проверяет: /health
# нативного сервера отвечает 200 при любом размере (дискриминатор — поле
# `model` payload'а); рассинхрон ловит strata-use.sh. Пины профилей закрывают
# видимое для llama-swap: в strata-профилях закрыты родитель и соседний
# размер (`~` → 404), в родительских — strata-ID (см. router/config.yaml).
#
# Изменение файла требует перезапуска llama-swap.

models:
  strata-iq3:
    name: "Strata IQ3_XXS"
    description: "Qwen3.8-Flash-Next IQ3_XXS @131072, нативный движок на хосте (:8081); юнит должен быть запущен strata-use.sh"
    cmd: |
      sh -c 'while curl -sfm 2 http://host.docker.internal:8081/health >/dev/null 2>&1; do sleep 1; done'
    proxy: http://host.docker.internal:8081
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 131072
    filters:
      stripParams: "repetition_penalty"

  strata-iq2:
    name: "Strata IQ2_XS"
    description: "Qwen3.8-Flash-Next IQ2_XS @262144, нативный движок на хосте (:8081); юнит должен быть запущен strata-use.sh"
    cmd: |
      sh -c 'while curl -sfm 2 http://host.docker.internal:8081/health >/dev/null 2>&1; do sleep 1; done'
    proxy: http://host.docker.internal:8081
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
    filters:
      stripParams: "repetition_penalty"

# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Движок Strata — обычный ребёнок llama-swap в роутер-контейнере (ADR-0008):
# автостарт по запросу к strata-iq3/strata-iq2, останов — вытеснением
# дефолтной exclusive-группой (запрос к qwen3.8-27b) или UI (PowerOff =
# SIGTERM, graceful QUIT движка). Ручных профилей и нативного юнита больше
# нет; схема — router/config.yaml, ADR-0008.
#
# cmd исполняется llama-swap БЕЗ shell (shlex-сплит), поэтому RAM-гейт — в
# скрипте-лаунчере /app/strata/strata-launch.sh: при нехватке MemAvailable
# мгновенный отказ с причиной (fail fast, без ретраев), иначе exec server.py.
# Пороги унаследованы от strata-use.sh (решение 08): 46 ГиБ (iq3) / 36 ГиБ
# (iq2) — page-locked эксперты 47/36 ГиБ + запас.
#
# Артефакты: веса/паки/mtp/expert-profile — RO-маунты /opt/strata/{models,
# packs,mtp,data} (compose); конфиги — /app/strata/*.container.json (копии
# нативных с host 0.0.0.0); движок — /opt/strata/engine из образа. Контракт
# strata-ID (reasoning-словарь none|low|medium|high, field model в ответе —
# канон native-ID, llama-swap его не переписывает) — ADR-0007. Холодный старт
# ~15–25 c, окна молчания клиентов — docs/runbook-strata.md.
#
# Изменение файла требует перезапуска llama-swap.

models:
  strata-iq3:
    name: "Strata IQ3_XXS"
    description: "Qwen3.8-Flash-Next IQ3_XXS @131072"
    cmd: |
      /app/strata/strata-launch.sh
      48234496
      /app/strata/strata-iq3_xxs.container.json
      ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 131072
    filters:
      stripParams: "repetition_penalty"

  strata-iq2:
    name: "Strata IQ2_XS"
    description: "Qwen3.8-Flash-Next IQ2_XS @262144"
    cmd: |
      /app/strata/strata-launch.sh
      37748736
      /app/strata/strata-iq2_xs.container.json
      ${PORT}
    proxy: http://127.0.0.1:${PORT}
    checkEndpoint: /health
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
    filters:
      stripParams: "repetition_penalty"

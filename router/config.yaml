# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Единая точка входа: три прямые cmd-модели — qwen3.8-27b (NInfer TP=2,
# config.d/20-ninfer.yaml) и strata-iq3/strata-iq2 (Strata,
# config.d/30-strata.yaml). Профилей и пинов больше нет (ADR-0009): все
# модели живут в одной дефолтной exclusive-группе v265 и переключаются
# автоматически по запросам (swap: старт целевого процесса после выхода
# вытесненных, порядок unload→start гарантирован). Ручных действий нет —
# ни PUT /api/profiles/active, ни скриптов. /v1/models всегда показывает
# три рабочих ID — 404-ловушек нет.
#
# Sampling и reasoning клиент задаёт сам (ADR-0006).
#
# Изменение файла требует перезапуска llama-swap. Маунт одиночным файлом:
# правка подменой файла (rename редактором) меняет инод — тогда
# `docker compose up -d --force-recreate llama-swap`, обычный restart видит
# старое содержимое.

healthCheckTimeout: 600   # время на холодный старт движка; отсчёт сбрасывается на прогрессе загрузки
logLevel: info
logToStdout: both
sendLoadingState: false   # баннер стримится только в reasoning_content, потребителей нет (issues/13, ADR-0006)

# NInfer (qwen3.8-27b) прелоадится на старте: публичный ID есть сразу.
# Ожидаемо в старте: `[ERROR] failed to preload model qwen3.8-27b: status
# 404` — у движка нет warmup-эндпоинта, прелоад при этом запускает и
# прогревает его (issues/12, ADR-0006). globalTTL не задаём (0 — движок не
# выгружается по простоям); `status: unloaded` в /v1/models — косметика v265,
# реальное состояние — /health upstream-порта.
hooks:
  on_startup:
    preload:
      - qwen3.8-27b

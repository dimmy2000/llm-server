# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json
#
# Единая точка входа: три публичных ID — qwen3.8-27b (llama.cpp или NInfer) и
# strata-iq3/strata-iq2 (Strata, config.d/30-strata.yaml). Профили задают
# ТОЛЬКО движок родителя: переключение llama.cpp ↔ NInfer вручную,
#
#   PUT http://localhost:8080/api/profiles/active {"name":"llama"|"ninfer"}
#
# strata-ID нигде не запинены и переключаются автоматически по запросам:
# все модели без явного routing живут в одной дефолтной exclusive-группе
# v265 (swap: старт целевого процесса до старта нового, RAM/VRAM-порядок
# гарантирован). 404-ловушек пин-схемы нет — /v1/models всегда показывает
# три рабочих ID. Схема конфига — ADR-0008; политика отказов (RAM-гейт в
# cmd, fail fast без ретраев) — там же; окна молчания холодного старта —
# docs/runbook-strata.md.
#
# Записи движков backend-* скрыты (unlisted); прямой запрос к ним работает
# как к обычной модели exclusive-группы (снаружи API только localhost/LAN).
# Sampling и reasoning клиент задаёт сам (ADR-0006).
#
# Изменение файла требует перезапуска llama-swap. Маунт одиночным файлом:
# правка подменой файла (rename редактором) меняет инод — тогда
# `docker compose up -d --force-recreate llama-swap`, обычный restart видит
# старое содержимое.

healthCheckTimeout: 600   # максимум прежних 300 (llama) / 600 (ninfer); отсчёт сбрасывается на прогрессе загрузки
logLevel: info
logToStdout: both
sendLoadingState: false   # баннер стримится только в reasoning_content, потребителей нет (issues/13, ADR-0006)

# NInfer прелоадится на старте и активен по умолчанию: публичный ID есть сразу.
# Ожидаемо в старте: `[ERROR] failed to preload model backend-ninfer: status
# 404` — у движка нет warmup-эндпоинта, прелоад при этом прогревает его
# (issues/12, ADR-0006). globalTTL не задаём (0 — движок не выгружается по
# простою); `status: unloaded` в /v1/models — косметика v265, реальное
# состояние: /api/profiles или /health upstream-порта.
hooks:
  on_startup:
    profile: ninfer
    preload:
      - backend-ninfer

profiles:
  llama:
    description: "Движок родителя: llama.cpp"
    pins:
      qwen3.8-27b: backend-llama
  ninfer:
    description: "Движок родителя: NInfer TP=2 (дефолт)"
    pins:
      qwen3.8-27b: backend-ninfer

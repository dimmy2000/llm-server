services:
  # Сервис без ключа `profiles:` — поднимается всегда, в т.ч. при вызове с
  # любым `--profile`. Профилей, выражающих «какой движок», больше нет:
  # выбор движка живёт внутри контейнера (активный профиль llama-swap,
  # см. config.yaml).
  #
  # Имя контейнера — `llama-swap`: по нему работают `docker logs/exec/restart
  # llama-swap` и UI llama-swap.
  llama-swap:
    image: llm-server/router:v265-strata1
    build:
      context: .
      dockerfile: Dockerfile
      # Исходники Strata для build-стадии Dockerfile (upstream checkout с
      # движком в /opt/strata); в образ идут только бинарники и serve/.
      additional_contexts:
        - strata-src=/opt/strata
      args:
        LLAMA_SWAP_VERSION: v265
        LLAMA_SWAP_ASSET: llama-swap_265_linux_amd64.tar.gz
        LLAMA_SWAP_SHA256: cb1f9a94be05afa129d3c17868f1dd2ca710b919333c7b868239dc31575dcfa1
        NINFER_VERSION: v0.4.6
        NINFER_ASSET: ninfer-tp2-v0.4.6-linux-x86_64-sm120a-ubuntu26.04.tar.gz
        NINFER_SHA256: aadbaaf99e3204fd97a5afe130254a7dd06430f404f1951c5d3ab74f8588c614
        CUDA_ARCHITECTURES: "120"
    container_name: llama-swap
    ports:
      - "8080:8080"
    # Page-locked память движков (NInfer-веса, Strata-эксперты 47/36 ГиБ):
    # без ulimit memlock=-1 движок Strata падает на mlock (требование
    # upstream /opt/strata/Dockerfile).
    ulimits:
      memlock:
        soft: -1
        hard: -1
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/models:/models:ro
      # Веса/артефакты Strata — по абсолютным путям контейнерных конфигов
      # (router/strata/*.container.json); RO — движок только читает.
      - /opt/strata/models:/opt/strata/models:ro
      - /opt/strata/packs:/opt/strata/packs:ro
      - /opt/strata/mtp:/opt/strata/mtp:ro
      - /opt/strata/data:/opt/strata/data:ro
      # Лаунчер (RAM-гейт) и контейнерные конфиги Strata — с хоста: правка
      # переживает restart контейнера, пересборка не нужна.
      - ./strata:/app/strata:ro
      - ./config.yaml:/app/config.yaml:ro
      - ./config.d:/app/config.d:ro
    restart: unless-stopped

# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: both
sendLoadingState: true
includeAliasesInList: true

# Единственная модель запускается llama-swap как дочерний процесс llama-server
# (бинарник и CUDA-библиотеки входят в образ llama-swap:cuda13).
# Модель прелоадится при старте: переключать нечего, поэтому первый запрос не
# ждёт чтения весов с диска.
hooks:
  on_startup:
    preload:
      - qwen3.8-27b

models:
  qwen3.8-27b:
    name: "qwen3.8-27b"
    cmd: >
      /app/llama-server --host 127.0.0.1 --port ${PORT}
      --model /models/Qwen3.8-27B-NVFP4-MTP-GGUF/Qwen3.8-27B-NVFP4-MTP-HIGH.gguf
      --mmproj /models/Qwen3.8-27B-NVFP4-MTP-GGUF/mmproj-BF16.gguf
      --mmproj-offload
      --n-gpu-layers 999
      --split-mode tensor
      --tensor-split 50,50
      --ctx-size 180224
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --cache-ram 40960
      --cache-idle-slots
      --batch-size 2048
      --ubatch-size 512
      --threads 8
      --flash-attn on
      --fit off
      --jinja
      --reasoning on
      --spec-type draft-mtp,ngram-mod
      --spec-draft-type-k q8_0
      --spec-draft-type-v q8_0
      --spec-draft-n-max 4
      --spec-draft-p-min 0.75
      --spec-ngram-mod-n-match 20
      --spec-ngram-mod-n-min 4
      --spec-ngram-mod-n-max 48

    filters:
      # Клиент не управляет ни сэмплингом, ни thinking - всё задаётся режимом
      stripParams: "temperature, top_p, top_k, min_p, presence_penalty, repeat_penalty, reasoning, reasoning_effort, chat_template_kwargs"

      setParamsByID:
        # Режим 1: быстрые ответы без thinking
        "qwen3.8-27b":
          temperature: 0.7
          top_p: 0.8
          top_k: 20
          min_p: 0.0
          presence_penalty: 1.5
          repeat_penalty: 1.05
          reasoning-budget: 0
          reasoning: "off"
          chat_template_kwargs:
            enable_thinking: false

        # Режим 2: чат с thinking, reasoning скрыт (preserve off), effort low
        "qwen3.8-27b-chat-low":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
            reasoning_effort: low

        # Режим 3: чат с thinking, reasoning скрыт (preserve off), effort medium
        "qwen3.8-27b-chat-medium":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
            reasoning_effort: medium

        # Режим 4: чат с thinking, reasoning скрыт (preserve off), effort xhigh
        "qwen3.8-27b-chat-xhigh":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: false
            reasoning_effort: xhigh

        # Режим 5: агент, thinking возвращается (preserve on), effort low
        "qwen3.8-27b-agent-low":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
            reasoning_effort: low

        # Режим 6: агент, thinking возвращается (preserve on), effort medium
        "qwen3.8-27b-agent-medium":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
            reasoning_effort: medium

        # Режим 7: агент, thinking возвращается (preserve on), effort xhigh
        "qwen3.8-27b-agent-xhigh":
          temperature: 1.0
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.05
          reasoning: "on"
          chat_template_kwargs:
            enable_thinking: true
            preserve_thinking: true
            reasoning_effort: xhigh
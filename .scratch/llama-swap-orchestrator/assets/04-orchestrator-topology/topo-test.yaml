healthCheckTimeout: 30
logLevel: debug
logToStdout: both

hooks:
  on_startup:
    profile: llama
    preload:
      - backend-llama

models:
  backend-llama:
    name: "llama.cpp"
    cmd: "sleep 3600"
    checkEndpoint: none
    unlisted: true
    useModelName: qwen3.8-27b
    proxy: "http://127.0.0.1:19001"
  backend-ninfer:
    name: "NInfer"
    cmd: "sleep 3600"
    checkEndpoint: none
    unlisted: true
    useModelName: qwen3.8-27b
    proxy: "http://127.0.0.1:19002"

profiles:
  llama:
    description: "llama.cpp active"
    pins:
      qwen3.8-27b: backend-llama
      backend-ninfer: ~
  ninfer:
    description: "NInfer active"
    pins:
      qwen3.8-27b: backend-ninfer
      backend-llama: ~

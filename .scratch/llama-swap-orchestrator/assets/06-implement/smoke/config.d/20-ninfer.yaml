# Приближение router/config.d/20-ninfer.yaml: cmd -> sleep, proxy -> fake backend.
models:
  backend-ninfer:
    name: "NInfer TP=2"
    unlisted: true
    useModelName: qwen3.8-27b
    env:
      - LD_LIBRARY_PATH=/opt/ninfer/lib:/app:/usr/local/cuda-13.3/lib64
    cmd: "sleep 3600"
    checkEndpoint: none
    proxy: "http://127.0.0.1:19012"
    capabilities:
      in: [text, image]
      out: [text]
      tools: true
      context: 262144
    filters:
      stripParams: "repetition_penalty"

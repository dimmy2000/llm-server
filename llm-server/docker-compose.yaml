services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-mtp
    image: local/llama-server:mtp-gemma4
    container_name: llama-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8080:8080"
    volumes:
      - /opt/models:/models
      - ./models.ini:/models.ini
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --models-preset /models.ini
      --models-max 1
      --host 0.0.0.0
      --port 8080
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 50s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"
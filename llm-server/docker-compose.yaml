services:
  llama-server:
    build:
      context: .
      dockerfile: Dockerfile.llama-mtp
    image: local/llama-server:mtp-gemma4
    container_name: llama-server
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    volumes:
      - /opt/models:/models:ro
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --host 0.0.0.0
      --port 8080
      --model /models/gemma-4-12b-it-Q6_K.gguf
      --mmproj /models/mmproj-F32.gguf
      --no-mmproj-offload
      --alias gemma4
      --model-draft /models/gemma-4-12B-it-MTP-Q8_0.gguf
      --spec-type draft-mtp
      --spec-draft-n-max 4
      --n-gpu-layers 48
      --ctx-size 196608
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 512
      --threads 6
      --flash-attn on
      --temp 1.0
      --top-p 0.95
      --top-k 64
      --jinja
      --reasoning on
    restart: unless-stopped

  llama-swap:
    image: ghcr.io/mostlygeek/llama-swap:cuda13
    container_name: llama-swap
    ports:
      - "8080:8080"
    volumes:
      - ./config.yaml:/app/config.yaml:ro
    depends_on:
      - llama-server
    restart: unless-stopped
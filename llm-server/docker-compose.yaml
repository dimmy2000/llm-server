services:
  open-webui:
    image: openwebui/open-webui:0.9.5
    container_name: open-webui
    ports:
      - "3000:8080"
    volumes:
      - ./open-webui/data:/app/backend/data
    environment:
      - WEBUI_SECRET_KEY=ba69155fbb3f8b7e2f52df78ea57ec65da63ca5ee7acbbf39736d74c9c46b625
      - USER_AGENT=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/144.0.0.0 YaBrowser/26.3.0.0 Safari/537.36
      - AUDIO_STT_ENGINE=openai
      - AUDIO_STT_OPENAI_API_BASE_URL=http://192.168.17.69:3333/v1
      - AUDIO_STT_OPENAI_API_KEY=dummy
      - AUDIO_STT_MODEL=small
      - AUDIO_STT_SUPPORTED_CONTENT_TYPES=audio/mpeg,audio/mp3,audio/wav,audio/x-wav,audio/mp4,audio/x-m4a,audio/webm,audio/ogg,audio/flac,audio/mpga,video/mp4,video/webm,video/x-matroska,video/quicktime,video/x-msvideo,video/mpeg
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda13
    container_name: gemma4
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    ports:
      - "8080:8080"
    volumes:
      - ./models:/models
      - ./tool_chat_template_gemma4.jinja:/models/gemma4.tmpl
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
    command: >
      --model /models/gemma-4-26B-A4B-it-UD-IQ4_XS.gguf
      --mmproj /models/gemma-4-26B-A4B-it-mmproj-F32.gguf
      --no-mmproj-offload
      --no-kv-offload
      --no-warmup
      --alias gemma4
      --temp 1.0
      --top-p 0.95 
      --top-k 64
      --n-gpu-layers 99
      --cache-ram 0
      --ctx-size 65536
      --parallel 1
      --cache-type-k q8_0
      --cache-type-v q8_0
      --batch-size 2048
      --ubatch-size 1024
      --threads 9
      --threads-batch 9
      --flash-attn on
      --host 0.0.0.0
      --port 8080
      --jinja
      --chat-template-file /models/gemma4.tmpl
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 50s
      timeout: 10s
      retries: 10
    logging:
      driver: json-file
      options:
        max-size: "100m"
        max-file: "5"

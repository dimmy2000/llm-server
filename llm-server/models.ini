[*]
# Глобальные настройки для всех моделей
host=0.0.0.0
flash-attn=true
threads=6
jinja=true
batch-size=2048
ubatch-size=512
cache-type-k=q8_0
cache-type-v=q8_0

[gemma4-thinking]
# модель для чата, планирования, распознавания картинок
alias=gemma4-thinking
model=/models/gemma-4-12b-it-Q8_0.gguf
mmproj=/models/mmproj-F32.gguf
model-draft=/models/gemma-4-12B-it-MTP-Q8_0.gguf
spec-type=draft-mtp
spec-draft-n-max=4
no-mmproj-offload=true
n-gpu-layers=99
ctx-size=65536
parallel=1
temp=1.0
top-p=0.95
top-k=64
reasoning=on

[gemma4-instruct]
# модель для быстрых ответов
alias=gemma4-instruct
model=/models/gemma-4-12b-it-Q8_0.gguf
model-draft=/models/gemma-4-12B-it-MTP-Q8_0.gguf
spec-type=draft-mtp
spec-draft-n-max=4
n-gpu-layers=99
ctx-size=65536
parallel=1
temp=1.0
top-p=0.95
top-k=64
reasoning=off
reasoning-budget=0

[gemma4-agent-plan]
# модель для агентного режима планирования
alias=gemma4-agent-plan
model=/models/gemma-4-12b-it-Q8_0.gguf
model-draft=/models/gemma-4-12B-it-MTP-Q8_0.gguf
spec-type=draft-mtp
spec-draft-n-max=4
n-gpu-layers=99
ctx-size=65536
parallel=1
temp=0.7
top-p=0.9
top-k=40
reasoning=on

[gemma4-agent-code]
# модель для агентного режима разработки
alias=gemma4-agent-code
model=/models/gemma-4-12b-it-Q8_0.gguf
model-draft=/models/gemma-4-12B-it-MTP-Q8_0.gguf
spec-type=draft-mtp
spec-draft-n-max=4
n-gpu-layers=99
ctx-size=65536
parallel=1
temp=0.6
top-p=0.95
top-k=20
min-p=0.0
presence-penalty=0.0
repeat-penalty=1.0
reasoning=off
reasoning-budget=0
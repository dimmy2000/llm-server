# yaml-language-server: $schema=https://raw.githubusercontent.com/mostlygeek/llama-swap/refs/heads/main/config-schema.json

healthCheckTimeout: 300
logLevel: info
logToStdout: both
sendLoadingState: true
includeAliasesInList: true

models:
  gemma4:
    name: "gemma4"
    # Llama-swap просто пересылает запросы в соседний контейнер по имени сервиса
    proxy: "http://llama-server:8080"
    cmd: "sleep 99999999"
    checkEndpoint: "none"

    filters:
      # Не даём клиенту переопределять сэмплинг - управляем им через setParamsByID
      stripParams: "temperature, top_p, top_k, min_p, presence_penalty, repeat_penalty"

      setParamsByID:
        # Режим 1: чат с reasoning, мультимодальность
        "gemma4-thinking":
          temperature: 1.0
          top_p: 0.95
          top_k: 64
          repeat_penalty: 1.15
          reasoning: "on"

        # Режим 2: быстрые ответы
        "gemma4-instruct":
          temperature: 1.0
          top_p: 0.95
          top_k: 64
          repeat_penalty: 1.0
          reasoning: "off"
          chat_template_kwargs:
            enable_thinking: false

        # Режим 3: агентное планирование
        "gemma4-agent-plan":
          temperature: 0.7
          top_p: 0.9
          top_k: 40
          repeat_penalty: 1.1
          reasoning: "on"

        # Режим 4: агентная разработка кода
        "gemma4-agent-code":
          temperature: 0.6
          top_p: 0.95
          top_k: 20
          min_p: 0.0
          presence_penalty: 0.0
          repeat_penalty: 1.0
          reasoning: "on"
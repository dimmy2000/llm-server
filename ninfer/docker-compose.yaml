services:
  # Имя сервиса обязано отличаться от `llama-swap` в llama/docker-compose.yaml:
  # compose include молча сливает сервисы с одинаковым именем (проверено на
  # compose 5.5.1), из-за чего image/cmd/profiles двух профилей схлопнулись бы
  # в один. Имя контейнера оставлено `llama-swap`, чтобы внешние потребители
  # (docker logs/exec, дашборды) не зависели от движка за маршрутизатором.
  ninfer-swap:
    profiles:
      - ninfer
    image: llm-server/ninfer-tp2:v0.4.6
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NINFER_VERSION: v0.4.6
        NINFER_ASSET: ninfer-tp2-v0.4.6-linux-x86_64-sm120a-ubuntu26.04.tar.gz
        NINFER_SHA256: aadbaaf99e3204fd97a5afe130254a7dd06430f404f1951c5d3ab74f8588c614
    container_name: llama-swap
    ports:
      - "8080:8080"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: -1
              capabilities:
                - gpu
    environment:
      NVIDIA_VISIBLE_DEVICES: all
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
    volumes:
      - /opt/models:/models:ro
      - ./config.yaml:/app/config.yaml:ro
    restart: unless-stopped
